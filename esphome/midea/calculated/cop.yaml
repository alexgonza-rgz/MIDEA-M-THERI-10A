# ==================================================
# 91_COP
# ==================================================
# Sensores calculados de potencia y COP.
#
# - Potencia eléctrica estimada = tensión x intensidad de la unidad exterior
#   (registros 0x77 y 0x76, que ya se leen). Contrastada con el Deye el 02/11/2026:
#   queda ~0,15 kW por debajo (no incluye bomba ni electrónica) con +-10 %.
#   El registro R147 (0x93) y el bloque 1000+ no valen para potencia.
# - En calefacción: potencia térmica = caudal x (ida - retorno)
# - En refrigeración: potencia térmica = caudal x (retorno - ida)
#
# Resistencia de apoyo IBH1 (${resistencia_apoyo_kw} kW, medida con el Deye el 22/11/2026):
# entra cuando el compresor se para (por ejemplo, al acabar un ciclo de ACS). Ni la
# tensión x intensidad de la unidad exterior ni los contadores del equipo la cuentan.
# - Se suma a la potencia eléctrica estimada.
# - Si trabaja ella sola (compresor a 0 Hz), toda su potencia sale como calor
#   (rendimiento 1): el caudal x ΔT no la mide porque el salto de agua es ~0.

substitutions:
  resistencia_apoyo_kw: "3.0"

sensor:
  - platform: template
    name: "Potencia resistencia apoyo estimada"
    id: "${devicename}_potencia_resistencia_apoyo"
    icon: mdi:heat-wave
    unit_of_measurement: "kW"
    device_class: power
    state_class: measurement
    accuracy_decimals: 2
    update_interval: 10s
    lambda: |-
      if (id(${devicename}_resistencia_ibh1).state) {
        return ${resistencia_apoyo_kw};
      }
      return 0.0;

  - platform: template
    name: "Delta T agua"
    id: "${devicename}_delta_t_agua"
    icon: mdi:delta
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 10s
    lambda: |-
      if (isnan(id(${devicename}_temperatura_impulsion_agua).state) ||
          isnan(id(${devicename}_temperatura_retorno_agua).state)) {
        return NAN;
      }

      float ida = id(${devicename}_temperatura_impulsion_agua).state;
      float retorno = id(${devicename}_temperatura_retorno_agua).state;

      return ida - retorno;

  - platform: template
    name: "Potencia eléctrica estimada"
    id: "${devicename}_potencia_electrica_estimada"
    icon: mdi:flash
    unit_of_measurement: "kW"
    device_class: power
    state_class: measurement
    accuracy_decimals: 2
    update_interval: 10s
    lambda: |-
      float i = id(${devicename}_intensidad_exterior).state;
      float v = id(${devicename}_tension_exterior).state;

      if (isnan(i) || isnan(v)) {
        return NAN;
      }

      float resistencia = id(${devicename}_potencia_resistencia_apoyo).state;
      if (isnan(resistencia)) {
        resistencia = 0.0;
      }

      return i * v / 1000.0 + resistencia;

  - platform: template
    name: "Potencia térmica calculada"
    id: "${devicename}_potencia_termica_calculada"
    icon: mdi:calculator
    unit_of_measurement: "kW"
    state_class: measurement
    accuracy_decimals: 2
    update_interval: 10s
    lambda: |-
      // Trabaja solo la resistencia de apoyo: todo su consumo es calor.
      float hz = id(${devicename}_frecuencia_compresor).state;
      if (id(${devicename}_resistencia_ibh1).state && (isnan(hz) || hz <= 0)) {
        return ${resistencia_apoyo_kw};
      }

      if (isnan(id(${devicename}_caudal_agua).state) ||
          isnan(id(${devicename}_temperatura_impulsion_agua).state) ||
          isnan(id(${devicename}_temperatura_retorno_agua).state)) {
        return NAN;
      }

      float flow = id(${devicename}_caudal_agua).state;
      float ida = id(${devicename}_temperatura_impulsion_agua).state;
      float retorno = id(${devicename}_temperatura_retorno_agua).state;
      float delta = 0.0;

      if (flow <= 0.02) {
        return 0.0;
      }

      if (id(${devicename}_modo_actual_leido).state == "Calor") {
        delta = ida - retorno;
      }
      else if (id(${devicename}_modo_actual_leido).state == "Frío") {
        delta = retorno - ida;
      }
      else if (id(${devicename}_modo_actual_leido).state == "Calentando ACS") {
        delta = ida - retorno;
      }
      else {
        return 0.0;
      }

      if (delta <= 0.1) {
        return 0.0;
      }

      return 1.163 * flow * delta;

  - platform: template
    name: "COP instantáneo"
    id: "${devicename}_cop_instantaneo"
    icon: mdi:speedometer
    unit_of_measurement: "COP"
    accuracy_decimals: 2
    state_class: measurement
    update_interval: 10s
    lambda: |-
      float p_termica = id(${devicename}_potencia_termica_calculada).state;
      float p_electrica = id(${devicename}_potencia_electrica_estimada).state;

      // Si la máquina está parada y la resistencia apagada, devolvemos 0.
      if (!id(${devicename}_maquina_en_marcha).state &&
          !id(${devicename}_resistencia_ibh1).state) {
        return 0.0;
      }

      // Si falta algún dato, devolvemos 0.
      if (isnan(p_termica) || isnan(p_electrica)) {
        return 0.0;
      }

      // Evitamos divisiones por cero.
      if (p_termica <= 0.05 || p_electrica <= 0.05) {
        return 0.0;
      }

      return p_termica / p_electrica;
    filters:
      # Las temperaturas del agua tienen resolución de 1 °C: se promedia
      # 2 minutos (12 lecturas) y se publica cada 30 s.
      - sliding_window_moving_average:
          window_size: 12
          send_every: 3

  - platform: template
    name: "COP acumulado"
    id: "${devicename}_cop_acumulado"
    icon: mdi:chart-line
    unit_of_measurement: "COP"
    accuracy_decimals: 2
    state_class: measurement
    update_interval: 30s
    lambda: |-
      float consumo = id(${devicename}_energia_electrica_consumida).state;
      float producida = id(${devicename}_energia_termica_producida).state;

      if (isnan(consumo) || isnan(producida) || consumo <= 0.01) {
        return 0.0;
      }

      return producida / consumo;
