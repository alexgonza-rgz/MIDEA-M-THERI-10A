# ==================================================
# 80_TEXT_SENSORS
# ==================================================

text_sensor:
  - platform: modbus_controller
    modbus_controller_id: "${devicename}"
    name: "Modo actual leído"
    id: "${devicename}_modo_actual_leido"
    icon: mdi:state-machine
    register_type: holding
    address: 0x65
    response_size: 2
    lambda: |-
      int idx = item->offset;
      uint16_t v = (uint16_t(data[idx]) << 8) + uint16_t(data[idx + 1]);
      if (v == 0) return std::string("Apagada");
      if (v == 2) return std::string("Frío");
      if (v == 3) return std::string("Calor");
      if (v == 5) return std::string("Calentando ACS");
      return std::string("Desconocido: ") + std::to_string(v);

  - platform: template
    name: "Estado real"
    id: "${devicename}_estado_real"
    icon: mdi:information
    update_interval: 10s
    lambda: |-
      if (id(${devicename}_modo_actual_leido).state == "Apagada") return std::string("Apagada");
      if (id(${devicename}_desescarche_activo).state) return std::string("Desescarche");
      if (id(${devicename}_retorno_aceite_activo).state) return std::string("Retorno de aceite");
      if (id(${devicename}_valvula_acs_activa).state) return std::string("ACS");
      if (id(${devicename}_maquina_en_marcha).state) return id(${devicename}_modo_actual_leido).state;
      return std::string("En espera");

  - platform: template
    name: "Resumen aerotermia"
    id: "${devicename}_resumen_aerotermia"
    icon: mdi:text-box-search
    update_interval: 10s
    lambda: |-
      char buffer[280];
      snprintf(buffer, sizeof(buffer),
        "%s | Ida %.1f°C | Ret %.1f°C | ACS %.1f°C | Comp %.0fHz | Caudal %.2fm³/h | COPi %.2f | P %.2fbar",
        id(${devicename}_estado_real).state.c_str(),
        id(${devicename}_temperatura_impulsion_agua).state,
        id(${devicename}_temperatura_retorno_agua).state,
        id(${devicename}_temperatura_deposito_acs).state,
        id(${devicename}_frecuencia_compresor).state,
        id(${devicename}_caudal_agua).state,
        id(${devicename}_cop_instantaneo).state,
        id(${devicename}_presion_circuito_calefaccion).state
      );
      return std::string(buffer);

  # Código de error en texto. El sensor numérico (registro 0x7C) devuelve el
  # "número de serie" del error según la tabla del manual de servicio Midea
  # M-Thermal (E0 = 1, E8 = 9, P1 = 21, ...). Los L0-L9 no tienen número.
  # Si el valor aún no es válido no se publica nada y se mantiene el último estado.
  - platform: template
    name: "Error actual (texto)"
    id: "${devicename}_error_actual_texto"
    icon: mdi:alert-circle
    update_interval: 10s
    lambda: |-
      static const std::map<int, std::string> errores = {
        {1,   "E0 – Fallo de caudal de agua (E8 x3, reinicio manual)"},
        {2,   "E1 – Error de secuencia de fases"},
        {3,   "E2 – Comunicación placa hidrónica / interfaz de usuario"},
        {4,   "E3 – Sensor temperatura salida de agua final (T1)"},
        {5,   "E4 – Sensor temperatura depósito ACS (T5)"},
        {6,   "E5 – Sensor refrigerante salida intercambiador de aire (T3)"},
        {7,   "E6 – Sensor temperatura ambiente exterior (T4)"},
        {8,   "E7 – Sensor depósito de inercia superior (Tbt1)"},
        {9,   "E8 – Fallo de caudal de agua"},
        {10,  "E9 – Sensor tubo de aspiración (Th)"},
        {11,  "EA – Sensor tubo de descarga (Tp)"},
        {12,  "Eb – Sensor panel solar (Tsolar)"},
        {13,  "Ec – Sensor depósito de inercia inferior (Tbt2)"},
        {14,  "Ed – Sensor agua de entrada al intercambiador (Tw_in)"},
        {15,  "EE – Error EEPROM de la caja hidrónica"},
        {20,  "P0 – Protección presostato de baja"},
        {21,  "P1 – Protección presostato de alta"},
        {23,  "P3 – Protección de corriente del compresor"},
        {24,  "P4 – Protección temperatura de descarga"},
        {25,  "P5 – Diferencia excesiva de temperatura entrada/salida de agua"},
        {26,  "P6 – Protección del módulo inverter"},
        {31,  "Pb – Protección anticongelación del intercambiador de agua"},
        {33,  "Pd – Alta temperatura refrigerante en refrigeración"},
        {38,  "PP – Agua de entrada más caliente que la de salida"},
        {39,  "H0 – Comunicación unidad exterior / caja hidrónica"},
        {40,  "H1 – Comunicación unidad exterior / driver del inverter"},
        {41,  "H2 – Sensor refrigerante salida línea líquido (T2)"},
        {42,  "H3 – Sensor refrigerante entrada línea gas (T2B)"},
        {43,  "H4 – P6 repetido 3 veces en una hora"},
        {44,  "H5 – Sensor temperatura ambiente (Ta)"},
        {45,  "H6 – Error ventilador DC"},
        {46,  "H7 – Tensión del circuito principal anómala"},
        {47,  "H8 – Error sensor de presión"},
        {48,  "H9 – Sensor salida de agua circuito 2 (Tw2)"},
        {49,  "HA – Sensor salida de agua del intercambiador (Tw_out)"},
        {50,  "Hb – PP repetido 3 veces y Tw_out < 7 °C"},
        {54,  "HF – Error EEPROM del inverter"},
        {55,  "HH – Error ventilador DC repetido (10 veces en 120 min)"},
        {57,  "HP – Protección baja presión en refrigeración"},
        {65,  "C7 – Temperatura excesiva del módulo del inverter"},
        {112, "bH – Error placa PED"},
        {116, "F1 – Tensión del bus DC demasiado baja"}
      };
      float x = id(${devicename}_codigo_error_actual).state;
      if (isnan(x)) return {};
      int n = (int) x;
      if (n == 0) return std::string("Sin error");
      auto it = errores.find(n);
      if (it != errores.end()) return it->second;
      return std::string("Código desconocido (") + std::to_string(n) + ")";
