# ==================================================
# 40_SWITCHES
# ==================================================
# Interruptores de funciones.
#
# Protección de arranque:
# - No se publica un estado falso antes de leer Modbus.
# - No se permiten escrituras sobre registros compartidos sin lectura previa.
# - turn_on_action/turn_off_action solo escriben cuando se recibe una orden.
#
# Registros:
# - Zona 1: registro 0x00 bit 1 -> 0x0002
# - ACS: registro 0x00 bit 2 -> 0x0004
# - Modo silencioso: registro 0x05 bit 6 -> 0x0040
# - Nivel silencioso: registro 0x05 bit 7 -> 0x0080
# - Modo ECO: registro 0x05 bit 10 -> 0x0400
# - Curva climática zona 1: registro 0x05 bit 12 -> 0x1000
# - ACS rápida: registro 0x07, escribe 1 ON y 2 OFF

switch:
  # ==================================================
  # CALEFACCIÓN / REFRIGERACIÓN ZONA 1
  # ==================================================
  - platform: template
    name: "Calefacción y refrigeración zona 1"
    id: "${devicename}_activar_clima_zona_1"
    icon: mdi:home-thermometer
    entity_category: config
    restore_mode: DISABLED
    optimistic: false

    lambda: |-
      if (!id(${devicename}_registro_potencias_interno).has_state()) {
        return {};
      }

      return (id(reg_0_potencias) & 0x0002) == 0x0002;

    turn_on_action:
      - lambda: |-
          if (!id(${devicename}_registro_potencias_interno).has_state()) {
            ESP_LOGW(
              "midea",
              "Registro 0x00 aún no leído; se ignora encender zona 1"
            );
            return;
          }

          uint16_t new_value = id(reg_0_potencias) | 0x0002;
          id(reg_0_potencias) = new_value;

          auto cmd =
            esphome::modbus_controller::ModbusCommandItem::
              create_write_single_command(
                ${devicename},
                0x00,
                new_value
              );

          ${devicename}->queue_command(cmd);

    turn_off_action:
      - lambda: |-
          if (!id(${devicename}_registro_potencias_interno).has_state()) {
            ESP_LOGW(
              "midea",
              "Registro 0x00 aún no leído; se ignora apagar zona 1"
            );
            return;
          }

          uint16_t new_value = id(reg_0_potencias) & ~0x0002;
          id(reg_0_potencias) = new_value;

          auto cmd =
            esphome::modbus_controller::ModbusCommandItem::
              create_write_single_command(
                ${devicename},
                0x00,
                new_value
              );

          ${devicename}->queue_command(cmd);

