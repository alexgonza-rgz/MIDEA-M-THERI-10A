# ==================================================
# 63_ENERGY
# ==================================================
# La potencia eléctrica instantánea se calcula en calculated/cop.yaml
# (tensión x intensidad). El registro R147 (0x93) se retiró: no da valores reales.
# La potencia térmica del módulo hidráulico (0x8C, kW x 0,01) da valores reales con
# el compresor en marcha (contrastada con la potencia térmica calculada) y 0 con la
# máquina parada. No se usa en el COP: se mantiene para comparar y decidir más adelante.

sensor:
  - platform: modbus_controller
    modbus_controller_id: "${devicename}"
    name: "Potencia térmica módulo hidráulico"
    id: "${devicename}_potencia_termica_modulo_hidraulico"
    icon: mdi:heat-wave
    register_type: holding
    address: 0x8C
    value_type: U_WORD
    unit_of_measurement: "kW"
    accuracy_decimals: 2
    state_class: measurement
    filters:
      - lambda: return x * 0.01;

  - platform: modbus_controller
    modbus_controller_id: "${devicename}"
    name: "Energía eléctrica consumida"
    id: "${devicename}_energia_electrica_consumida"
    icon: mdi:lightning-bolt-outline
    register_type: holding
    address: 0x8F
    value_type: U_DWORD
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: total_increasing

  - platform: modbus_controller
    modbus_controller_id: "${devicename}"
    name: "Energía térmica producida"
    id: "${devicename}_energia_termica_producida"
    icon: mdi:radiator
    register_type: holding
    address: 0x91
    value_type: U_DWORD
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: total_increasing
